name: Aktualizace dat
on:
  schedule:
    - cron: "17 4 * * *"     # každý den ráno (cca 5:17 / 6:17 pražského času)
    - cron: "17 14 * * 4,5"  # čtvrtek a pátek odpoledne – nový fotbalový rozpis
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stáhnout data
        run: python zdroje.py
      - name: Uložit data
        run: |
          git config user.name "aktualizace-dat"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Data $(date -u +%F)"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
